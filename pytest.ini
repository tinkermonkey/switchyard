[pytest]
# Pytest configuration for orchestrator tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.11

# Command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Fail on unknown ini keys rather than warning (#204). Measured, with
    # pytest-timeout uninstalled: `timeout` and `timeout_method` below degrade
    # to two "PytestConfigWarning: Unknown config option" lines in the warnings
    # summary and the suite runs green with no timeout whatsoever. A per-test
    # timeout that quietly evaporates when a dependency is missing is the same
    # class of bug as one written in a section pytest does not read, which is
    # what #204 was.
    #
    # What this actually does in that state, measured (PYTHONNOUSERSITE=1, so
    # `importlib.util.find_spec('pytest_timeout')` is None): pytest prints
    # `ERROR: Unknown config option: timeout` -- on **stderr**, so it lands on
    # the `collecting ...` line in a terminal and vanishes entirely if you pipe
    # stdout -- collects the whole suite anyway (`collected 3781 items / 1
    # error`, the full count at this commit; the 1 error is
    # tests/unit/test_per_test_timeout.py, which imports the missing package on
    # purpose) and then exits 4 having run nothing. Collection is not skipped;
    # only the run phase is. So the failure is loud and no test runs, but do not
    # go looking for a pre-collection abort, because there is not one.
    #
    # IF YOU LANDED HERE FROM `ERROR: Unknown config option: timeout`:
    # pytest-timeout is a dependency this repo only acquired in #204. It is
    # pinned in requirements.txt, and both images install it from there
    # (Dockerfile:102, Dockerfile.agent:47) -- but an image built before #204
    # merged baked in the old requirements.txt, and nothing at container start
    # re-runs pip, so the layer stays stale until the image is rebuilt.
    # Rebuild: `docker compose build orchestrator`, then rebuild agent images,
    # which are `FROM switchyard-orchestrator:latest` (Dockerfile.agent:15).
    # Verified absent from the deployed image at the time #204 was written:
    # `docker run --rm --entrypoint sh switchyard-orchestrator -c 'python -c
    # "import importlib.util; print(importlib.util.find_spec(\"pytest_timeout\"))"'`
    # -> None. GitHub Actions is unaffected; unit-tests.yml does a plain
    # `pip install -r requirements.txt` on every run. tests/conftest.py prints
    # this same remedy on stdout in the header block when the plugin is not
    # registered, so it is visible without finding this file.
    --strict-config
    # Capture output
    --capture=no
    # Show locals in tracebacks
    --showlocals
    # Disable warnings summary (can be enabled with -W)
    #--disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed, some real services)
    e2e: End-to-end tests (slow, full system)
    slow: Slow tests (skip in fast CI runs)
    asyncio: Async tests
    allow_thread_leak: Test deliberately leaves a thread running (#186); exempt from the leaked-thread guard

# Async configuration
asyncio_mode = auto

# Per-test timeout (#204). Needs pytest-timeout, pinned in requirements.txt --
# without the plugin pytest does not recognise these two keys at all.
#
# 180s. Measured in the orchestrator container on tests/unit: the whole suite
# is 162s, the slowest single test is 45.1s
# (test_pipeline_run_id_propagation.py::TestPipelineRunIdPropagation::
# test_agent_completed_receives_pipeline_run_id_on_failure) and the next
# slowest is 14.9s. That 45s is a fixed wall-clock budget rather than CPU work
# -- four consecutive runs measured 45.07/45.14/45.15/45.14s -- so it does not
# stretch on slower or loaded hardware, and 4x is real headroom rather than a
# guess. 180s also keeps one wedged test to roughly the cost of one clean full
# run. A test that legitimately needs longer says so for itself:
#
#     @pytest.mark.timeout(600)
#
# which matters for tests/integration and tests/e2e: 177 tests that talk to
# real services and were NOT measured here.
timeout = 180

# method = thread. This is NOT the plugin default: pytest_timeout.py sets
# DEFAULT_METHOD = "signal" wherever SIGALRM exists, which is every platform
# this suite runs on. So the line changes behaviour and has to earn it.
#
# It does not earn it on the hazard #204 was filed around, and an earlier
# version of this comment claimed it did. Measured in the orchestrator
# container at timeout = 3 against the real
# tests/utils/builders.py::RecordedThread wedge -- `with
# patch('threading.Thread', RecordedThread)` around a ThreadPoolExecutor whose
# workers become no-ops, so the first `future.result()` blocks forever:
#
#   signal: `Failed: Timeout (>3.0s) from pytest-timeout.` at
#           threading.py:327 `waiter.acquire()`, as an ordinary test failure.
#           `1 failed in 3.38s`.
#   thread: the same frames, then os._exit(1).
#
# Same diagnosis. The `RuntimeError: cannot join thread before it is started`
# this comment used to attribute to signal reproduces only against a different
# fake -- a real Thread subclass with a no-op start() -- and not against the
# one this repo actually has, since RecordedThread is not a Thread subclass
# and its join() returns None. Two further measurements cut the same way:
#
#   - Stack dumps are not a thread-only feature. pytest_timeout.py's
#     timeout_sigalrm and timeout_timer both call dump_stacks, and a
#     two-thread deadlock under signal printed the culprit thread's
#     `time.sleep(300)` frame exactly as thread did.
#   - Neither method bounds a C-level loop holding the GIL. Under timeout = 3,
#     `sum(range(10 ** 11))` was still running when an external 45s kill took
#     it -- under both methods.
#
# What thread does buy, measured, is the one case signal cannot reach. signal
# delivers the timeout as an exception *into the test*, so test or library
# code that swallows it keeps hanging. A `while True:` wrapping `try:
# time.sleep(0.5) / except BaseException: pass` -- the shape of a lot of real
# retry code -- ran past an external 30s kill under signal, and was killed at
# 3s under thread, whose timer needs no cooperation from the test at all. That
# timer also survives the RecordedThread patch above, because
# `threading.Timer` subclasses the real `Thread` captured when `threading` was
# imported, so patching the module attribute cannot neuter it.
#
# The cost is real and accepted knowingly: thread calls os._exit(1), so there
# is no summary line and every test after the wedge is abandoned. Measured on
# a two-test file, the trailing passing test ran under signal (`1 failed, 1
# passed`) and did not run under thread. On .github/workflows/unit-tests.yml,
# which reports rather than gates, that costs the run its results. Taken
# anyway: a wedge is a backstop path rather than a routine failure, and a
# backstop a swallowed exception can defeat is not a backstop.
#
# There is a second cost, found in review, and it is not on the CI side:
# os._exit(1) skips every fixture teardown, session-scoped ones included. The
# one that matters is tests/conftest.py's session-autouse cleanup_test_data,
# which purges twice -- once on the way in, once on the way out -- and it is
# the way out that is lost. Measured at timeout = 3 against a wedged test with
# a session-autouse fixture appending a marker on setup and on teardown:
# signal wrote `pre` and `post`, thread wrote only `pre`.
#
# It matters because inside the orchestrator container _may_purge_service_data()
# is True, so that post-run purge is the only thing that deletes
# RATE_LIMIT_REDIS_KEYS -- global keys, not namespaced by project, read
# directly by the live dashboard through get_shared_rate_limit_status() -- plus
# test-project documents in the real orchestrator-*/pipeline-runs-* indices.
# Unit tests that drive graphql()/rest() with a mocked subprocess still run the
# real rate-limit mirror code, so those keys can be holding fabricated numbers
# at the moment the timer fires. Same shape as the hazard
# services/scheduled_tasks.py::_reap_orphaned_test_containers documents for
# project suites: in-process cleanup hooks only run on a graceful exit.
#
# The recovery is that cleanup_test_data purges on the way IN as well, so the
# next run of the suite clears whatever a wedged run left -- there is no
# sweeper, and nothing clears it in between.
# tests/unit/test_service_client_fail_fast.py::
# TestTheTestDataPurgeCannotRunAgainstSomebodyElsesStore guards that the
# entry-side purge stays, since this paragraph is the only thing relying on it.
#
# Not a reason to go back to signal, measured. The wedge thread exists for --
# `while True: try: time.sleep(0.5) / except BaseException: pass` -- absorbs
# signal's timeout exception AND SIGINT: two SIGINTs left it running, it had to
# be SIGKILLed, and the marker file held only `pre`. So under signal that class
# of wedge loses the post-run purge too, and loses the rest of the run with it.
# signal keeps the teardown only for wedges it can actually interrupt, and
# Ctrl-C on a hang it cannot does run it (marker `pre post`, exit 2). The
# exposure thread adds is therefore the narrow one: a wedge signal COULD have
# interrupted now ends the process instead, and the fabricated numbers sit in
# the live Redis until somebody starts the suite again.
timeout_method = thread

# No logging keys here, deliberately (#204). The two keys above used to sit in
# a `[pytest:log]` section that pytest never reads, which is what hid them for
# as long as it did; that whole section is now gone rather than relocated. It
# held:
#
#   log_cli = false            already the pytest default
#   log_cli_level/format/...   inert, and inert anyway with log_cli off
#   log_file = tests/test_run.log, log_file_level = DEBUG, and its formats
#
# Deleting it changes no behaviour: every key was either a pytest default or
# unread. `log_file` is the only one moving would have changed, so it was
# dropped rather than repaired. Measured by running tests/unit once with those
# exact settings restored: 3,981,563 bytes over 33,440 lines. That is a 3.8MB
# file per run, written into the tree the suite is specifically not supposed to
# write to (#181), for a sink nobody has missed in the time it was dead, and
# one `.gitignore`'s `*.log` would have kept out of sight while it grew. Want a
# file log? Ask per run: `--log-file=<path outside the checkout>`.

# Coverage options (when using pytest-cov)
[coverage:run]
source = .
omit =
    tests/*
    */site-packages/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Coverage thresholds
fail_under = 70

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
