[pytest]
# Pytest configuration for orchestrator tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.11

# Command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Fail on unknown ini keys rather than warning (#204). Measured, with
    # pytest-timeout uninstalled: `timeout` and `timeout_method` below degrade
    # to two "PytestConfigWarning: Unknown config option" lines in the warnings
    # summary and the suite runs green with no timeout whatsoever. A per-test
    # timeout that quietly evaporates when a dependency is missing is the same
    # class of bug as one written in a section pytest does not read, which is
    # what #204 was. With this, that state exits 4 before collecting anything.
    --strict-config
    # Capture output
    --capture=no
    # Show locals in tracebacks
    --showlocals
    # Disable warnings summary (can be enabled with -W)
    #--disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed, some real services)
    e2e: End-to-end tests (slow, full system)
    slow: Slow tests (skip in fast CI runs)
    asyncio: Async tests
    allow_thread_leak: Test deliberately leaves a thread running (#186); exempt from the leaked-thread guard

# Async configuration
asyncio_mode = auto

# Per-test timeout (#204). Needs pytest-timeout, pinned in requirements.txt --
# without the plugin pytest does not recognise these two keys at all.
#
# 180s. Measured in the orchestrator container on tests/unit: the whole suite
# is 162s, the slowest single test is 45.1s
# (test_pipeline_run_id_propagation.py::TestPipelineRunIdPropagation::
# test_agent_completed_receives_pipeline_run_id_on_failure) and the next
# slowest is 14.9s. That 45s is a fixed wall-clock budget rather than CPU work
# -- four consecutive runs measured 45.07/45.14/45.15/45.14s -- so it does not
# stretch on slower or loaded hardware, and 4x is real headroom rather than a
# guess. 180s also keeps one wedged test to roughly the cost of one clean full
# run. A test that legitimately needs longer says so for itself:
#
#     @pytest.mark.timeout(600)
#
# which matters for tests/integration and tests/e2e: 177 tests that talk to
# real services and were NOT measured here.
timeout = 180

# method = thread, deliberately, not just because it is the plugin default.
# Measured against the hazard this issue is actually about -- a test patching
# `threading.Thread` globally starves a ThreadPoolExecutor, and the first
# `future.result()` then blocks forever:
#
#   thread: killed at 3s with a stack dump naming `waiter.acquire()`. The
#           timer is immune to the patch that caused the wedge, because
#           `threading.Timer` subclasses the real `Thread` captured when
#           `threading` was imported, so patching the module attribute cannot
#           neuter it. It also bounds a blocking socket call in the main
#           thread (measured on a connect() to an unroutable address), because
#           it never has to interrupt the main thread at all.
#   signal: caught the same wedge at 3.05s, but reported
#           `RuntimeError: cannot join thread before it is started` from the
#           executor's __exit__ instead of a timeout. The hang is stopped and
#           the diagnosis is lost.
#
# The cost of `thread` is that it dumps every thread's stack and hard-exits, so
# tests after the wedge do not run. Accepted: this is a backstop for a hang,
# not a routine failure path, and the stack dump is the thing you need.
timeout_method = thread

# No logging keys here, deliberately (#204). The two keys above used to sit in
# a `[pytest:log]` section that pytest never reads, which is what hid them for
# as long as it did; that whole section is now gone rather than relocated. It
# held:
#
#   log_cli = false            already the pytest default
#   log_cli_level/format/...   inert, and inert anyway with log_cli off
#   log_file = tests/test_run.log, log_file_level = DEBUG, and its formats
#
# Deleting it changes no behaviour: every key was either a pytest default or
# unread. `log_file` is the only one moving would have changed, so it was
# dropped rather than repaired. Measured by running tests/unit once with those
# exact settings restored: 3,981,563 bytes over 33,440 lines. That is a 3.8MB
# file per run, written into the tree the suite is specifically not supposed to
# write to (#181), for a sink nobody has missed in the time it was dead, and
# one `.gitignore`'s `*.log` would have kept out of sight while it grew. Want a
# file log? Ask per run: `--log-file=<path outside the checkout>`.

# Coverage options (when using pytest-cov)
[coverage:run]
source = .
omit =
    tests/*
    */site-packages/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Coverage thresholds
fail_under = 70

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
