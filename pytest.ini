[pytest]
# Pytest configuration for orchestrator tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.11

# Command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Capture output
    --capture=no
    # Show locals in tracebacks
    --showlocals
    # Disable warnings summary (can be enabled with -W)
    #--disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed, some real services)
    e2e: End-to-end tests (slow, full system)
    slow: Slow tests (skip in fast CI runs)
    asyncio: Async tests
    allow_thread_leak: Test deliberately leaves a thread running (#186); exempt from the leaked-thread guard

# Async configuration
asyncio_mode = auto

# Coverage options (when using pytest-cov)
[coverage:run]
source = .
omit =
    tests/*
    */site-packages/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Coverage thresholds
fail_under = 70

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Logging configuration
[pytest:log]
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
# NOTE: there is currently NO per-test timeout, and these two keys do not
# provide one. They sit under [pytest:log], a section pytest does not read, AND
# pytest-timeout is not installed (requirements.txt pins only pytest and
# pytest-asyncio). Both would have to change together for a timeout to exist.
#
# Left here rather than deleted so the next person finds this note instead of
# re-deriving it. What made this matter: a test that patches threading.Thread
# globally can starve a ThreadPoolExecutor, and .result() then blocks forever
# with nothing to interrupt it. That specific hazard is fixed at source (the
# patches are scoped to services.project_monitor now), but an unbounded suite
# is still a hole worth closing deliberately.
# timeout = 300
# timeout_method = thread
